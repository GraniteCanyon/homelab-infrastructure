<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Segmented homelab logical topology</title><desc id="desc">Internet connects to UniFi UDM-SE and core switch, branching to management VLAN 10, servers VLAN 20, clients VLAN 30, and IoT VLAN 40. Device placement and firewall enforcement are not depicted.</desc><rect width="1200" height="650" rx="20" fill="#111827"/><g font-family="Arial,sans-serif"><text x="60" y="66" fill="#f9fafb" font-size="32" font-weight="bold">A segmented home network</text><text x="60" y="102" fill="#b8c5d8" font-size="18">Logical topology · Ayden Lotter · sanitized infrastructure overview</text><g stroke="#8ea3bd" stroke-width="3" fill="none"><path d="M600 184V212 M600 282V312 M600 382V415 M180 415H1020 M180 415V447 M460 415V447 M740 415V447 M1020 415V447"/></g><rect x="460" y="130" width="280" height="54" rx="12" fill="#1e293b" stroke="#64748b"/><text x="600.0" y="159" text-anchor="middle" fill="#f1f5f9" font-size="22">Internet</text><rect x="420" y="212" width="360" height="70" rx="12" fill="#1e293b" stroke="#64748b"/><text x="600.0" y="241" text-anchor="middle" fill="#f1f5f9" font-size="22">UniFi UDM-SE</text><text x="600.0" y="265" text-anchor="middle" fill="#bac8da" font-size="15">Gateway</text><rect x="420" y="312" width="360" height="70" rx="12" fill="#1e293b" stroke="#64748b"/><text x="600.0" y="341" text-anchor="middle" fill="#f1f5f9" font-size="22">Core switch</text><text x="600.0" y="365" text-anchor="middle" fill="#bac8da" font-size="15">Distribution</text><rect x="60" y="447" width="240" height="95" rx="12" fill="#1e293b" stroke="#a5b4fc" stroke-width="2"/><text x="180" y="480" text-anchor="middle" fill="#a5b4fc" font-size="17">VLAN 10</text><text x="180" y="515" text-anchor="middle" fill="#f9fafb" font-size="24">Management</text><rect x="340" y="447" width="240" height="95" rx="12" fill="#1e293b" stroke="#7dd3fc" stroke-width="2"/><text x="460" y="480" text-anchor="middle" fill="#7dd3fc" font-size="17">VLAN 20</text><text x="460" y="515" text-anchor="middle" fill="#f9fafb" font-size="24">Servers</text><rect x="620" y="447" width="240" height="95" rx="12" fill="#1e293b" stroke="#6ee7b7" stroke-width="2"/><text x="740" y="480" text-anchor="middle" fill="#6ee7b7" font-size="17">VLAN 30</text><text x="740" y="515" text-anchor="middle" fill="#f9fafb" font-size="24">Clients</text><rect x="900" y="447" width="240" height="95" rx="12" fill="#1e293b" stroke="#fcd34d" stroke-width="2"/><text x="1020" y="480" text-anchor="middle" fill="#fcd34d" font-size="17">VLAN 40</text><text x="1020" y="515" text-anchor="middle" fill="#f9fafb" font-size="24">IoT</text><text x="60" y="586" fill="#cbd5e1" font-size="17">Includes Linux · Proxmox · NAS · DGX Spark; device-to-VLAN placement omitted.</text><text x="60" y="617" fill="#cbd5e1" font-size="17">Logical separation is not proof of firewall enforcement. See the validation record.</text></g></svg>